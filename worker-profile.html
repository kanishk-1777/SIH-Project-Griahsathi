<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Worker Profile | Griahsathi</title>

<link rel="stylesheet" href="./output.css">
<script src="./griahsathi-core.js"></script>

<style>
body{
  background:#080B10;
  color:#fff;
}

.light-mode{
  background:#f5f7f6!important;
  color:#111827!important;
}

.card{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.1);
}

.light-mode .card{
  background:#fff;
  border-color:rgba(0,0,0,.08);
}

.light-mode input,
.light-mode textarea,
.light-mode select{
  background:#fff!important;
  color:#111827!important;
}

textarea{
  resize:vertical;
}
</style>
</head>

<body class="antialiased">

<div id="site-header"></div>

<main class="px-5 pb-16 pt-28">
  <div class="mx-auto max-w-6xl">
    <div id="content"></div>
  </div>
</main>

<script>

document.getElementById("site-header").innerHTML=GS.nav();
GS.bindNav();

const id=new URLSearchParams(location.search).get("id");

let worker=id
  ?GS.workers().find(w=>w.id===id)
  :GS.currentWorker();

if(!worker){
  location.href="worker-auth.html";
  throw new Error("worker");
}

GS.syncWorkerRatings(worker);

const isOwner=!id;


/* =========================
   CERTIFICATE FUNCTIONS
========================= */

function certStatus(c){
  return c.status || (c.verified ? "approved" : "pending");
}

function certBadge(c){

  const s=certStatus(c);

  return s==="approved"

    ? `
      <span class="rounded-full bg-green-400/10 px-3 py-1 text-xs font-semibold text-green-400">
        ✓ Approved
      </span>
      `

    : s==="rejected"

    ? `
      <span class="rounded-full bg-red-400/10 px-3 py-1 text-xs font-semibold text-red-300">
        ✕ Rejected
      </span>
      `

    : `
      <span class="rounded-full bg-yellow-400/10 px-3 py-1 text-xs font-semibold text-yellow-300">
        ⏳ Pending Approval
      </span>
      `;
}


/* =========================
   RENDER
========================= */

function render(){

  const fresh=isOwner
    ?GS.currentWorker()
    :GS.workers().find(w=>w.id===worker.id);

  if(!fresh){
    location.href="worker-auth.html";
    return;
  }

  Object.assign(worker,fresh);

  GS.syncWorkerRatings(worker);

  const verified=GS.certified(worker);

  const photoNow=worker.profilePhoto||"";

  const languages=Array.isArray(worker.languages)
    ?worker.languages.join(", ")
    :(worker.languages||"");


  content.innerHTML=`

  <!-- =========================
       HEADER
  ========================== -->

  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">

    <div>

      <p class="text-sm font-semibold uppercase tracking-[.2em] text-green-400">
        Worker Profile
      </p>

      <h1 class="mt-2 text-4xl font-bold">
        ${GS.escape(worker.name)}
      </h1>

    </div>


    ${
      id

      ? `
      <a
        href="find-worker.html"
        class="rounded-xl border border-white/10 px-4 py-3">

        Back to Workers

      </a>
      `

      : `

      <a
        href="worker-dashboard.html"
        class="rounded-xl border border-white/10 px-4 py-3">

        Dashboard

      </a>

      `
    }

  </div>


  <!-- =========================
       MAIN GRID
  ========================== -->

  <div class="mt-8 grid gap-8 lg:grid-cols-[.85fr_1.15fr]">


    <!-- =========================
         LEFT PROFILE CARD
    ========================== -->

    <section class="card rounded-3xl p-7">

      <div class="flex flex-col items-center text-center">


        <!-- PHOTO -->

        <div
          id="photoWrap"
          class="flex h-28 w-28 items-center justify-center overflow-hidden rounded-3xl bg-green-400/10 text-5xl text-green-400">

          ${
            photoNow

            ? `
            <img
              src="${photoNow}"
              class="h-full w-full object-cover">
            `

            : "👤"
          }

        </div>


        <h2 class="mt-5 text-2xl font-bold">
          ${GS.escape(worker.name)}
        </h2>


        <p class="mt-2 text-sm text-gray-400">

          ${
            worker.workerType==="contractor"
            ?"Contractor"
            :"Worker"
          }

          ·

          ${GS.escape(worker.city||"")}

          ,

          ${GS.escape(worker.state||"")}

        </p>


        <!-- BADGES -->

        <div class="mt-4 flex flex-wrap justify-center gap-2">

          ${
            verified

            ? `
            <span
              class="rounded-full border border-green-400/20 bg-green-400/10 px-3 py-1 text-xs font-semibold text-green-400">

              ✓ Certified

            </span>
            `

            : ""
          }


          <span
            class="rounded-full border px-3 py-1 text-xs font-semibold
            ${
              worker.available

              ? "border-green-400/20 text-green-400"

              : "border-red-400/20 text-red-300"
            }">

            ${
              worker.available
              ?"● Available"
              :"○ Not Available"
            }

          </span>

        </div>


        <!-- RATINGS -->

        <div class="mt-6 grid w-full grid-cols-2 gap-3">

          <div class="rounded-xl border border-white/10 p-4">

            <p class="text-xs text-gray-400">
              Rating
            </p>

            <p class="mt-1 text-xl font-bold">
              ⭐ ${Number(worker.ratingAverage||0).toFixed(1)}
            </p>

          </div>


          <div class="rounded-xl border border-white/10 p-4">

            <p class="text-xs text-gray-400">
              Ratings
            </p>

            <p class="mt-1 text-xl font-bold">
              ${worker.totalRatings||0}
            </p>

          </div>

        </div>


        <p class="mt-5 text-sm text-gray-500">
          Worker ID: ${GS.escape(worker.id)}
        </p>

      </div>


      <!-- PROFILE PHOTO EDIT -->

      ${
        isOwner

        ? `
        <div class="mt-7">

          <label class="mb-2 block text-sm font-semibold">
            Profile Photo
          </label>

          <input
            id="photoInput"
            type="file"
            accept="image/*"
            class="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3">


          <button
            id="savePhoto"
            class="mt-3 w-full rounded-xl bg-green-500 px-5 py-3 font-bold text-black">

            Save Profile Photo

          </button>

        </div>
        `

        : ""
      }

    </section>


    <!-- =========================
         RIGHT SECTION
    ========================== -->

    <section class="space-y-6">


      <!-- =========================
           ABOUT THE WORKER
      ========================== -->

      <div class="card rounded-3xl p-7">

        <div class="flex flex-wrap items-start justify-between gap-4">

          <div>

            <h2 class="text-2xl font-bold">
              About the Worker
            </h2>

            <p class="mt-1 text-sm text-gray-500">
              Tell customers about yourself, your experience and your work.
            </p>

          </div>


          ${
            isOwner

            ? `
            <button
              id="editAboutBtn"
              class="rounded-xl bg-green-500 px-4 py-2 font-bold text-black">

              ✏️ Edit About

            </button>
            `

            : ""
          }

        </div>


        <!-- ABOUT DISPLAY -->

        <div id="aboutView">

          <p class="mt-4 whitespace-pre-line leading-7 text-gray-400">

            ${
              GS.escape(
                worker.description ||
                "No description provided."
              )
            }

          </p>

        </div>


        <!-- ABOUT EDITOR -->

        ${
          isOwner

          ? `
          <div
            id="aboutEditor"
            class="mt-5 hidden rounded-2xl border border-green-400/20 bg-green-400/5 p-5">

            <label class="mb-2 block text-sm font-semibold">
              About the Worker
            </label>


            <textarea
              id="aboutInput"
              rows="7"
              maxlength="1000"
              placeholder="Write something about yourself, your skills, experience, work quality, etc."
              class="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 leading-6 outline-none focus:border-green-400"
            >${GS.escape(worker.description||"")}</textarea>


            <div class="mt-2 flex items-center justify-between text-xs text-gray-500">

              <span>
                Maximum 1000 characters
              </span>

              <span id="aboutCounter">
                ${(worker.description||"").length}/1000
              </span>

            </div>


            <div class="mt-4 flex flex-wrap gap-3">

              <button
                id="saveAbout"
                class="rounded-xl bg-green-500 px-5 py-3 font-bold text-black">

                💾 Save Changes

              </button>


              <button
                id="cancelAbout"
                class="rounded-xl border border-white/10 px-5 py-3 font-semibold">

                Cancel

              </button>

            </div>

          </div>
          `

          : ""
        }


        <!-- =========================
             LANGUAGES + ADDRESS DISPLAY
        ========================== -->

        <div class="mt-6 grid gap-5 sm:grid-cols-2">


          <!-- LANGUAGES -->

          <div class="rounded-2xl border border-white/10 p-5">

            <div class="flex items-start justify-between gap-3">

              <div>

                <p class="text-xs uppercase tracking-widest text-gray-500">
                  Languages
                </p>

                <p
                  id="languagesDisplay"
                  class="mt-2 leading-6">

                  ${
                    GS.escape(languages)
                    || "Not provided"
                  }

                </p>

              </div>


              ${
                isOwner

                ? `
                <button
                  id="editLanguagesBtn"
                  class="shrink-0 rounded-lg border border-green-400/20 px-3 py-2 text-sm font-semibold text-green-400">

                  ✏️ Edit

                </button>
                `

                : ""
              }

            </div>


            ${
              isOwner

              ? `
              <div
                id="languagesEditor"
                class="mt-4 hidden">

                <input
                  id="languagesInput"
                  type="text"
                  value="${GS.escape(languages)}"
                  placeholder="e.g. Hindi, English, Punjabi"
                  class="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 outline-none focus:border-green-400">


                <p class="mt-2 text-xs text-gray-500">
                  Separate multiple languages using commas.
                </p>


                <div class="mt-3 flex flex-wrap gap-2">

                  <button
                    id="saveLanguages"
                    class="rounded-lg bg-green-500 px-4 py-2 font-bold text-black">

                    Save

                  </button>


                  <button
                    id="cancelLanguages"
                    class="rounded-lg border border-white/10 px-4 py-2">

                    Cancel

                  </button>

                </div>

              </div>
              `

              : ""
            }

          </div>


          <!-- PROFESSIONAL ADDRESS -->

          <div class="rounded-2xl border border-white/10 p-5">

            <div class="flex items-start justify-between gap-3">

              <div>

                <p class="text-xs uppercase tracking-widest text-gray-500">
                  Professional Address
                </p>

                <p
                  id="addressDisplay"
                  class="mt-2 leading-6 text-gray-300">

                  ${
                    GS.escape(worker.address||"")
                  }

                  ${
                    worker.city
                    ? `, ${GS.escape(worker.city)}`
                    : ""
                  }

                  ${
                    worker.district
                    ? `, ${GS.escape(worker.district)}`
                    : ""
                  }

                  ${
                    worker.state
                    ? `, ${GS.escape(worker.state)}`
                    : ""
                  }

                  ${
                    worker.pincode
                    ? ` - ${GS.escape(worker.pincode)}`
                    : ""
                  }

                </p>

              </div>


              ${
                isOwner

                ? `
                <button
                  id="editAddressBtn"
                  class="shrink-0 rounded-lg border border-green-400/20 px-3 py-2 text-sm font-semibold text-green-400">

                  ✏️ Edit

                </button>
                `

                : ""
              }

            </div>


            ${
              isOwner

              ? `
              <div
                id="addressEditor"
                class="mt-4 hidden space-y-3">

                <input
                  id="addressInput"
                  type="text"
                  value="${GS.escape(worker.address||"")}"
                  placeholder="House / Shop / Professional address"
                  class="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 outline-none focus:border-green-400">


                <div class="grid gap-3 sm:grid-cols-2">

                  <input
                    id="cityInput"
                    type="text"
                    value="${GS.escape(worker.city||"")}"
                    placeholder="City"
                    class="rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 outline-none focus:border-green-400">


                  <input
                    id="districtInput"
                    type="text"
                    value="${GS.escape(worker.district||"")}"
                    placeholder="District"
                    class="rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 outline-none focus:border-green-400">

                </div>


                <div class="grid gap-3 sm:grid-cols-2">

                  <input
                    id="stateInput"
                    type="text"
                    value="${GS.escape(worker.state||"")}"
                    placeholder="State"
                    class="rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 outline-none focus:border-green-400">


                  <input
                    id="pincodeInput"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    value="${GS.escape(worker.pincode||"")}"
                    placeholder="Pincode"
                    class="rounded-xl border border-white/10 bg-white/[.04] px-4 py-3 outline-none focus:border-green-400">

                </div>


                <div class="flex flex-wrap gap-2 pt-1">

                  <button
                    id="saveAddress"
                    class="rounded-lg bg-green-500 px-4 py-2 font-bold text-black">

                    Save

                  </button>


                  <button
                    id="cancelAddress"
                    class="rounded-lg border border-white/10 px-4 py-2">

                    Cancel

                  </button>

                </div>

              </div>
              `

              : ""
            }

          </div>

        </div>

      </div>


      <!-- =========================
           CERTIFICATES
      ========================== -->

      <div class="card rounded-3xl p-7">

        <div class="flex flex-wrap items-center justify-between gap-3">

          <div>

            <h2 class="text-2xl font-bold">
              Certificates
            </h2>

            <p class="mt-1 text-sm text-gray-400">
              Certificates are reviewed by the Griahsathi admin.
            </p>

          </div>


          ${
            isOwner

            ? `
            <button
              id="addCertificate"
              class="rounded-xl bg-green-500 px-4 py-3 font-bold text-black">

              + Add Certificate

            </button>
            `

            : ""
          }

        </div>


        ${
          isOwner

          ? `
          <div
            id="certificateForm"
            class="mt-5 hidden rounded-2xl border border-green-400/20 bg-green-400/5 p-5">

            <div class="grid gap-3 sm:grid-cols-2">

              <input
                id="certificateName"
                placeholder="Certificate name"
                class="rounded-xl border border-white/10 bg-white/[.04] px-4 py-3">


              <input
                id="certificateIssuer"
                placeholder="Issuing organization (optional)"
                class="rounded-xl border border-white/10 bg-white/[.04] px-4 py-3">

            </div>


            <input
              id="certificateFile"
              type="file"
              accept=".pdf,.jpg,.jpeg,.png"
              class="mt-3 w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3">


            <button
              id="submitCertificate"
              class="mt-3 rounded-xl bg-green-500 px-5 py-3 font-bold text-black">

              Submit for Admin Approval

            </button>


            <p class="mt-2 text-xs text-gray-500">
              PDF, JPG and PNG are supported.
              This demo stores the file in browser storage.
            </p>

          </div>
          `

          : ""
        }


        <div class="mt-5 space-y-3">

          ${
            (worker.certifications||[]).length

            ?

            (worker.certifications||[])
            .slice()
            .reverse()
            .map(c=>`

              <div class="rounded-2xl border border-white/10 p-4">

                <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

                  <div>

                    <p class="font-bold">
                      ${GS.escape(c.name||"Certificate")}
                    </p>

                    <p class="text-xs text-gray-500">

                      ${GS.escape(c.issuer||"Issuer not provided")}

                      ·

                      ${
                        c.submittedAt
                        ?new Date(c.submittedAt).toLocaleDateString()
                        :""
                      }

                    </p>

                  </div>

                  ${certBadge(c)}

                </div>


                ${
                  c.status==="rejected" && c.rejectionReason

                  ? `
                  <p class="mt-3 text-sm text-red-300">

                    Reason:
                    ${GS.escape(c.rejectionReason)}

                  </p>
                  `

                  : ""
                }


                ${
                  c.data

                  ? `
                  <a
                    href="${c.data}"
                    target="_blank"
                    class="mt-3 inline-block text-sm font-semibold text-green-400">

                    View uploaded certificate

                  </a>
                  `

                  : ""
                }

              </div>

            `)
            .join("")

            :

            `
            <p class="text-sm text-gray-400">
              No certificates submitted yet.
            </p>
            `
          }

        </div>

      </div>


      <!-- =========================
           REGISTERED SERVICES
      ========================== -->

      <div class="card rounded-3xl p-7">

        <h2 class="text-2xl font-bold">
          Registered Services
        </h2>


        <div class="mt-5 grid gap-3 sm:grid-cols-2">

          ${
            (worker.services||[]).map(s=>`

              <div class="rounded-xl border border-white/10 p-4">

                <div class="flex items-center justify-between gap-2">

                  <span class="font-semibold">

                    ${GS.escape(
                      GS.service(s.slug)?.title||s.slug
                    )}

                  </span>


                  <span class="font-bold text-green-400">

                    ₹${s.price}

                    ${
                      s.priceType==="hourly"
                      ?"/hr"
                      :s.priceType==="daily"
                      ?"/day"
                      :""
                    }

                  </span>

                </div>

              </div>

            `).join("")

            ||

            `
            <p class="text-sm text-gray-400">
              No services registered.
            </p>
            `
          }

        </div>

      </div>


      <!-- =========================
           REVIEWS
      ========================== -->

      <div class="card rounded-3xl p-7">

        <h2 class="text-2xl font-bold">
          Reviews from Customers
        </h2>


        <div class="mt-5 space-y-4">

          ${
            (worker.reviews||[]).length

            ?

            (worker.reviews||[])
            .slice()
            .reverse()
            .map(r=>`

              <div class="rounded-2xl border border-white/10 p-4">

                <div class="flex justify-between gap-3">

                  <p class="font-bold">
                    ${GS.escape(r.customerName||"Customer")}
                  </p>

                  <p>
                    ⭐ ${r.rating}/5
                  </p>

                </div>


                <p class="mt-2 text-sm leading-6 text-gray-400">

                  ${GS.escape(
                    r.review||"No written review."
                  )}

                </p>

              </div>

            `).join("")

            :

            `
            <p class="text-sm text-gray-400">
              Reviews will appear after completed work.
            </p>
            `
          }

        </div>

      </div>


    </section>

  </div>
  `;


  /* =================================================
     OWNER-ONLY FUNCTIONS
  ================================================= */

  if(isOwner){


    /* =========================
       PROFILE PHOTO
    ========================== */

    savePhoto.onclick=()=>{

      const f=photoInput.files[0];

      if(!f){

        alert("Choose an image first.");
        return;

      }

      const reader=new FileReader();

      reader.onload=()=>{

        worker.profilePhoto=reader.result;

        GS.saveWorker(worker);

        render();

      };

      reader.readAsDataURL(f);

    };


    /* =========================
       ABOUT EDIT
    ========================== */

    editAboutBtn.onclick=()=>{

      aboutEditor.classList.remove("hidden");

      aboutView.classList.add("hidden");

      aboutInput.focus();

    };


    saveAbout.onclick=()=>{

      const newAbout=aboutInput.value.trim();

      if(!newAbout){

        alert("Please write something about yourself.");

        aboutInput.focus();

        return;

      }


      worker.description=newAbout;

      GS.saveWorker(worker);

      alert("About the Worker updated successfully.");

      render();

    };


    cancelAbout.onclick=()=>{

      aboutInput.value=worker.description||"";

      aboutEditor.classList.add("hidden");

      aboutView.classList.remove("hidden");

    };


    aboutInput.addEventListener("input",()=>{

      aboutCounter.textContent=
        `${aboutInput.value.length}/1000`;

    });


    /* =========================
       LANGUAGE EDIT
    ========================== */

    editLanguagesBtn.onclick=()=>{

      languagesEditor.classList.remove("hidden");

      languagesDisplay.parentElement
        .parentElement
        .classList.add("hidden");

      languagesInput.focus();

    };


    saveLanguages.onclick=()=>{

      const value=languagesInput.value.trim();

      if(!value){

        alert("Please enter at least one language.");

        languagesInput.focus();

        return;

      }


      const languageArray=value
        .split(",")
        .map(x=>x.trim())
        .filter(Boolean);


      worker.languages=languageArray;

      GS.saveWorker(worker);

      alert("Languages updated successfully.");

      render();

    };


    cancelLanguages.onclick=()=>{

      languagesEditor.classList.add("hidden");

      languagesDisplay
        .parentElement
        .parentElement
        .classList.remove("hidden");

    };


    /* =========================
       ADDRESS EDIT
    ========================== */

    editAddressBtn.onclick=()=>{

      addressEditor.classList.remove("hidden");

      addressDisplay
        .parentElement
        .parentElement
        .classList.add("hidden");

      addressInput.focus();

    };


    saveAddress.onclick=()=>{

      const address=addressInput.value.trim();
      const city=cityInput.value.trim();
      const district=districtInput.value.trim();
      const state=stateInput.value.trim();
      const pincode=pincodeInput.value.trim();


      if(!address){

        alert("Please enter your professional address.");

        addressInput.focus();

        return;

      }


      if(pincode && !/^\d{6}$/.test(pincode)){

        alert("Please enter a valid 6-digit pincode.");

        pincodeInput.focus();

        return;

      }


      worker.address=address;
      worker.city=city;
      worker.district=district;
      worker.state=state;
      worker.pincode=pincode;


      GS.saveWorker(worker);

      alert("Professional address updated successfully.");

      render();

    };


    cancelAddress.onclick=()=>{

      addressEditor.classList.add("hidden");

      addressDisplay
        .parentElement
        .parentElement
        .classList.remove("hidden");

    };


    /* =========================
       CERTIFICATES
    ========================== */

    addCertificate.onclick=()=>{

      certificateForm.classList.toggle("hidden");

    };


    submitCertificate.onclick=()=>{

      const name=certificateName.value.trim();
      const issuer=certificateIssuer.value.trim();
      const f=certificateFile.files[0];


      if(!name||!f){

        alert(
          "Enter a certificate name and choose the certificate file."
        );

        return;

      }


      if(f.size>3*1024*1024){

        alert(
          "Please keep the certificate file below 3 MB for this browser demo."
        );

        return;

      }


      const reader=new FileReader();

      reader.onload=()=>{

        worker.certifications=
          worker.certifications||[];


        worker.certifications.push({

          id:GS.uid("CERT"),

          name,

          issuer,

          fileName:f.name,

          mimeType:f.type,

          data:reader.result,

          status:"pending",

          verified:false,

          submittedAt:new Date().toISOString()

        });


        GS.saveWorker(worker);


        alert(
          "Certificate submitted. It will show as Pending Approval until an admin approves it."
        );


        render();

      };


      reader.readAsDataURL(f);

    };

  }

}
