<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | Griahsathi</title>
<link rel="stylesheet" href="./output.css"><script src="./griahsathi-core.js"></script><style>body{background:#080B10;color:#fff}.light-mode{background:#f5f7f6!important;color:#111827!important}.card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1)}.light-mode .card{background:#fff}</style></head>
<body><div id="site-header"></div><main class="min-h-screen px-5 pt-28"><div class="mx-auto max-w-md"><div class="card rounded-3xl p-7 sm:p-9"><p class="text-sm font-semibold uppercase tracking-[.2em] text-green-400">Admin Portal</p><h1 class="mt-3 text-3xl font-bold">Secure Admin Login</h1><p class="mt-3 text-sm text-gray-400">Prototype credentials are provided for demonstration.</p><div class="mt-6 space-y-4"><input id="email" type="email" value="admin@griahsathi.test" class="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3"><input id="password" type="password" value="Admin@123" class="w-full rounded-xl border border-white/10 bg-white/[.04] px-4 py-3"><button id="login" class="w-full rounded-xl bg-green-500 px-6 py-3 font-bold text-black">Login</button><p id="msg" class="hidden rounded-xl p-3 text-sm"></p></div></div></div></main>
<script>document.getElementById("site-header").innerHTML=GS.nav();GS.bindNav();login.onclick=()=>{if(email.value==="admin@griahsathi.test"&&password.value==="Admin@123"){localStorage.setItem(GS.keys.adminSession,"yes");location.href="admin-dashboard.html"}else{msg.textContent="Invalid prototype credentials.";msg.className="rounded-xl bg-red-400/10 p-3 text-sm text-red-300";}};</script><script src="./griahsathi-language.js"></script>
<script src="./griahsathi-ai.js"></script>
</body></html>
